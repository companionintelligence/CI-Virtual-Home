<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Virtual home shots · Companion Intelligence</title>
  <!--
    Browser for the headless product-shot renders of the 30 virtual homes (the HouseSpec houses). Each card opens its home in
    the editor (../../room-creator.html); the portal (../../index.html) is the public gallery.

    Static: reads ./manifest.json (written by scripts/render-house-shots.mts, `pnpm run shots`) and
    ../../content/houses/index.json (author credits) — nothing else. Serve the repo root over http
    (ES-module-free, but fetch() needs it):  npx serve .  →  /video/houses/
    The renders next to this file are git-ignored; only index.html is tracked (.gitignore re-includes it).
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* Canon subset of @companionintelligence/tokens tokens.css (vendored from CI-Common: this page is served
       standalone from this repo's root, with no package to import the tokens from). Keep in sync. */
    :root {
      --radius: 0.625rem;
      --background: #f3faf7; --foreground: #0a222e;
      --card: #f0f9f5; --card-foreground: #0a222e; --destructive: #da302f; --chart-4: #855500;
      --primary: #0a6358; --primary-foreground: #f0fdf4;
      --secondary: #e8f2ec; --muted: #e8f2ec; --muted-foreground: #3a524b;
      --accent: #edf6f0; --border: #dfece6; --ring: #0a6358;
      --shadow-md: 0 1px 3px rgba(4, 22, 32, 0.05), 0 6px 18px -6px rgba(10, 99, 88, 0.07);
      --media: #0a222e;   /* the letterbox behind a render: dark in both themes */
      --gradient-aurora: radial-gradient(1200px circle at 50% -20%, rgba(232, 242, 236, 0.65), transparent 52%),
        radial-gradient(900px circle at 80% 0%, rgba(10, 99, 88, 0.04), transparent 45%);
      --font-sans: "Manrope", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;
      --font-letter-spacing: 0.2pt; --font-word-spacing: 0.4pt;
      color-scheme: light;
    }
    .dark {
      --background: #041620; --foreground: #e8f2f4;
      --card: #0c323c; --card-foreground: #e8f2f4; --destructive: #ef7070; --chart-4: #70a6af;
      --primary: #c5e8dc; --primary-foreground: #041620;
      --secondary: #073038; --muted: #073038; --muted-foreground: #a3babf;
      --accent: #0a2e38; --border: #073038; --ring: #c5e8dc;
      --shadow-md: 0 1px 3px rgba(0, 0, 0, 0.24), 0 6px 18px -8px rgba(0, 0, 0, 0.32);
      --media: #021018;
      --gradient-aurora: radial-gradient(1200px circle at 50% -20%, rgba(200, 230, 217, 0.08), transparent 55%);
      color-scheme: dark;
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--background); background-image: var(--gradient-aurora);
      color: var(--foreground);
      font-family: var(--font-sans); font-size: 14px; line-height: 1.45;
      letter-spacing: var(--font-letter-spacing); word-spacing: var(--font-word-spacing);
      -webkit-font-smoothing: antialiased; min-height: 100vh;
    }
    a { color: var(--primary); }
    button { font: inherit; letter-spacing: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
    .mono { font-family: var(--font-mono); letter-spacing: 0; word-spacing: normal; }

    header { max-width: 1440px; margin: 0 auto; padding: 32px 24px 16px; display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: flex-end; }
    header h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
    header .sub { margin: 4px 0 0; color: var(--muted-foreground); }
    header .sub .mono { font-size: 12px; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-left: auto; }
    .controls input[type=search] {
      font: inherit; letter-spacing: inherit; color: var(--foreground); background: var(--card);
      border: 1px solid var(--border); border-radius: calc(var(--radius) - 2px); padding: 7px 10px; min-width: 220px;
    }
    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: calc(var(--radius) - 2px); overflow: hidden; background: var(--card); }
    .seg button { border: 0; background: transparent; padding: 7px 11px; cursor: pointer; font-weight: 500; font-size: 13px; }
    .seg button + button { border-left: 1px solid var(--border); }
    .seg button[aria-pressed=true] { background: var(--primary); color: var(--primary-foreground); }
    a.btn { text-decoration: none; color: inherit; display: inline-flex; align-items: center; }
    .btn { border: 1px solid var(--border); background: var(--card); border-radius: calc(var(--radius) - 2px); padding: 7px 11px; cursor: pointer; font-weight: 500; font-size: 13px; }
    .btn:hover, .seg button:not([aria-pressed=true]):hover { background: var(--accent); }

    main { max-width: 1440px; margin: 0 auto; padding: 8px 24px 64px; }
    .status { color: var(--muted-foreground); padding: 24px 0; }
    .status code { font-family: var(--font-mono); font-size: 12px; background: var(--muted); padding: 2px 6px; border-radius: 4px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; }

    .card { background: var(--card); color: var(--card-foreground); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-md); overflow: hidden; display: flex; flex-direction: column; }
    .card.missing { opacity: .6; }
    .media { position: relative; aspect-ratio: 16 / 9; background: var(--media); overflow: hidden; }
    .media.portrait { aspect-ratio: 9 / 16; max-height: 560px; margin: 0 auto; }
    .media img, .media video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; background: var(--media); }
    .media .play {
      position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; cursor: pointer; padding: 0;
      display: grid; place-items: center; color: var(--foreground);
    }
    .media .play::before {
      content: ""; width: 64px; height: 64px; border-radius: 50%; background: color-mix(in srgb, var(--media) 82%, transparent);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--primary-foreground) 70%, transparent); transition: transform .12s ease, background .12s ease;
    }
    .media .play::after {
      content: ""; position: absolute; width: 0; height: 0; margin-left: 5px;
      border-left: 20px solid var(--primary-foreground); border-top: 12px solid transparent; border-bottom: 12px solid transparent;
    }
    .media .play:hover::before { transform: scale(1.06); background: color-mix(in srgb, var(--primary) 85%, transparent); }
    .media .badge { position: absolute; left: 10px; top: 10px; background: color-mix(in srgb, var(--media) 80%, transparent); color: var(--primary-foreground); font-size: 11px; padding: 3px 7px; border-radius: 4px; pointer-events: none; }
    .media .qa { position: absolute; right: 10px; top: 10px; font-size: 11px; padding: 3px 7px; border-radius: 4px; pointer-events: auto; cursor: help; color: var(--foreground); background: var(--muted); }
    .media .qa.warn { box-shadow: inset 0 0 0 1px var(--chart-4); }
    .media .qa.err { box-shadow: inset 0 0 0 1px var(--destructive); }
    .media .nope { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted-foreground); background: var(--muted); font-size: 13px; }

    .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .title { display: flex; align-items: baseline; gap: 8px; }
    .title h2 { margin: 0; font-size: 15px; font-weight: 700; line-height: 1.3; }
    .credit { color: var(--muted-foreground); font-size: 12.5px; }
    .credit b { color: var(--foreground); font-weight: 600; }
    .style { color: var(--muted-foreground); font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 4px; }
    .shots { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    .shots button { border: 0; background: transparent; padding: 5px 9px; cursor: pointer; font-size: 12px; font-weight: 500; }
    .shots button + button { border-left: 1px solid var(--border); }
    .shots button[aria-pressed=true] { background: var(--primary); color: var(--primary-foreground); }
    .links { display: flex; gap: 10px; align-items: center; font-size: 12.5px; white-space: nowrap; }
    .links a { text-decoration: none; font-weight: 600; }
    .links a:hover { text-decoration: underline; }
    .links .dl { color: var(--muted-foreground); font-weight: 500; }
    .meta { color: var(--muted-foreground); font-size: 11.5px; }
    @media (max-width: 480px) { .grid { grid-template-columns: 1fr; } header { padding-top: 20px; } }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>House shots</h1>
      <p class="sub" id="sub">Loading manifest…</p>
    </div>
    <div class="controls">
      <input id="q" type="search" placeholder="Filter by house, author, style…" aria-label="Filter houses">
      <div class="seg" id="shot-filter" role="group" aria-label="Default shot"></div>
      <a class="btn" href="../../index.html" title="The public gallery">All homes</a>
      <a class="btn" href="../../room-creator.html" title="The editor: build, review and export">Editor</a>
      <button class="btn" id="theme" type="button" aria-label="Switch between the light and dark theme">Theme</button>
    </div>
  </header>
  <main>
    <div class="status" id="status" hidden></div>
    <div class="grid" id="grid"></div>
  </main>

  <script>
    (function () {
      'use strict';
      const ROOM_CREATOR = '../../room-creator.html';
      const $ = (s, el = document) => el.querySelector(s);
      const grid = $('#grid'), status = $('#status'), sub = $('#sub'), q = $('#q'), shotFilter = $('#shot-filter');

      // ---- theme: follow the OS, remember an explicit choice
      const root = document.documentElement;
      const applyTheme = (t) => root.classList.toggle('dark', t === 'dark');
      let theme = null;
      try { theme = localStorage.getItem('house-shots-theme'); } catch {}
      applyTheme(theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
      $('#theme').addEventListener('click', () => {
        const next = root.classList.contains('dark') ? 'light' : 'dark';
        applyTheme(next); try { localStorage.setItem('house-shots-theme', next); } catch {}
      });

      let manifest = null, houses = [], byHouse = new Map(), shotTypes = [], defaultShot = null, current = null, bust = '';

      async function load() {
        let m, idx;
        try {
          const r = await fetch('manifest.json', { cache: 'no-store' });
          if (!r.ok) throw new Error(`manifest.json → HTTP ${r.status}`);
          m = await r.json();
        } catch (e) {
          status.hidden = false;
          status.innerHTML = `No <code>manifest.json</code> next to this page (${e.message}). Render first: <code>pnpm run shots --shot door-to-core,orbit --res 1080 --aspect 16:9</code>, then serve the repo root over http (fetch() will not run from <code>file://</code>).`;
          sub.textContent = 'No renders yet.';
          return;
        }
        try {
          const r = await fetch('../../content/houses/index.json', { cache: 'no-store' });
          idx = r.ok ? await r.json() : { houses: [] };
        } catch { idx = { houses: [] }; }

        manifest = m;
        // re-renders keep the same file names; key the media URLs on the manifest timestamp so the browser refetches
        bust = m.generated ? `?r=${encodeURIComponent(m.generated)}` : '';
        for (const s of m.shots || []) {
          if (!byHouse.has(s.id)) byHouse.set(s.id, new Map());
          byHouse.get(s.id).set(s.shot, s);
          if (!shotTypes.includes(s.shot)) shotTypes.push(s.shot);
        }
        // index.json order first; anything rendered but not indexed goes at the end under its id
        const indexed = new Set();
        for (const h of idx.houses || []) { houses.push(h); indexed.add(h.id); }
        for (const id of byHouse.keys()) if (!indexed.has(id)) houses.push({ id, name: id, author: null });

        const params = new URLSearchParams(location.search);
        defaultShot = shotTypes.includes(params.get('shot')) ? params.get('shot') : shotTypes[0];

        const rendered = [...byHouse.keys()].length;
        const when = m.generated ? new Date(m.generated) : null;
        sub.innerHTML = `${rendered} of ${houses.length} houses · ${(m.shots || []).length} renders · <span class="mono">${m.res || '?'}p ${m.aspect || ''}</span>` +
          (when ? ` · rendered ${when.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' })}` : '');

        shotFilter.innerHTML = '';
        for (const t of shotTypes) {
          const b = document.createElement('button');
          b.type = 'button'; b.textContent = t; b.setAttribute('aria-pressed', String(t === defaultShot));
          b.addEventListener('click', () => {
            defaultShot = t;
            for (const x of shotFilter.children) x.setAttribute('aria-pressed', String(x === b));
            for (const card of grid.children) if (card._setShot) card._setShot(t, false);
            const u = new URL(location.href); u.searchParams.set('shot', t); history.replaceState(null, '', u);
          });
          shotFilter.appendChild(b);
        }

        render();
      }

      function render() {
        grid.innerHTML = '';
        for (const h of houses) grid.appendChild(card(h));
        applyFilter();
      }

      function card(h) {
        const shots = byHouse.get(h.id) || new Map();
        const el = document.createElement('article');
        el.className = 'card' + (shots.size ? '' : ' missing');
        el.dataset.search = [h.id, h.name, h.author, h.style, h.source].filter(Boolean).join(' ').toLowerCase();

        const media = document.createElement('div');
        media.className = 'media' + ((manifest.aspect || '16:9') === '9:16' ? ' portrait' : '');
        const body = document.createElement('div'); body.className = 'body';

        const title = document.createElement('div'); title.className = 'title';
        title.innerHTML = `<h2></h2>`;
        title.querySelector('h2').textContent = h.name || h.id;

        const credit = document.createElement('div'); credit.className = 'credit';
        const bits = [];
        if (h.storeys) bits.push(`${h.storeys}-storey`);
        if (h.areaSqm) bits.push(`${h.areaSqm} m²`);
        credit.innerHTML = (h.author ? `by <b></b>` : '<b>uncredited</b>') + (bits.length ? ` · ${bits.join(' · ')}` : '') + (h.source ? ` · <span class="mono" style="font-size:11px"></span>` : '');
        if (h.author) credit.querySelector('b').textContent = h.author;
        if (h.source) credit.querySelector('.mono').textContent = h.source;

        const style = document.createElement('div'); style.className = 'style'; style.textContent = h.style || '';
        style.title = h.style || '';

        const row = document.createElement('div'); row.className = 'row';
        const picker = document.createElement('div'); picker.className = 'shots'; picker.setAttribute('role', 'group'); picker.setAttribute('aria-label', 'Shot');
        const links = document.createElement('div'); links.className = 'links';
        const open = document.createElement('a'); open.textContent = 'Open in the editor'; open.target = '_blank'; open.rel = 'noopener';
        const dlMp4 = document.createElement('a'); dlMp4.className = 'dl'; dlMp4.textContent = 'MP4';
        const dlWebm = document.createElement('a'); dlWebm.className = 'dl'; dlWebm.textContent = 'WebM';
        links.append(open, dlMp4, dlWebm);
        const meta = document.createElement('div'); meta.className = 'meta';
        row.append(picker, links);
        body.append(title, credit, style, row, meta);
        el.append(media, body);

        let shot = shots.has(defaultShot) ? defaultShot : [...shots.keys()][0];
        let video = null;

        function stop() {
          if (video) { video.pause(); video.remove(); video = null; showPoster(); }
          if (current === el) current = null;
        }

        // shot QA from the renderer (manifest qa.errors / qa.warnings): hover for the findings
        function qaBadge(s) {
          const frag = document.createDocumentFragment();
          const errs = (s.qa && s.qa.errors) || [], warns = (s.qa && s.qa.warnings) || [];
          if (!errs.length && !warns.length) return frag;
          const b = document.createElement('span'); b.className = 'qa mono ' + (errs.length ? 'err' : 'warn');
          b.textContent = errs.length ? `${errs.length} error${errs.length === 1 ? '' : 's'}` : `${warns.length} warning${warns.length === 1 ? '' : 's'}`;
          b.title = [...errs.map(e => `ERROR t=${e.t}${e.tEnd > e.t ? '–' + e.tEnd : ''} ${e.code}: ${e.message}`), ...warns.map(w => `warn t=${w.t}${w.tEnd > w.t ? '–' + w.tEnd : ''} ${w.code}: ${w.message}`)].join('\n');
          frag.append(b); return frag;
        }

        function showPoster() {
          media.innerHTML = '';
          const s = shots.get(shot);
          if (!s) { media.innerHTML = '<div class="nope">not rendered yet</div>'; return; }
          if (s.error && !s.mp4) { media.innerHTML = `<div class="nope">not rendered — ${s.error.replace(/</g, '&lt;')}</div>`; media.append(qaBadge(s)); return; }
          const img = document.createElement('img'); img.src = s.poster + bust; img.alt = `${h.name || h.id} — ${shot} poster`; img.loading = 'lazy'; img.decoding = 'async';
          const badge = document.createElement('span'); badge.className = 'badge mono'; badge.textContent = shot;
          const play = document.createElement('button'); play.className = 'play'; play.type = 'button'; play.setAttribute('aria-label', `Play ${shot} for ${h.name || h.id}`);
          play.addEventListener('click', playVideo);
          media.append(img, badge, play, qaBadge(s));
        }

        function playVideo() {
          const s = shots.get(shot);
          if (!s || !(s.mp4 || s.webm)) return;
          if (current && current !== el && current._stop) current._stop();
          current = el;
          media.innerHTML = '';
          video = document.createElement('video');
          video.controls = true; video.autoplay = true; video.playsInline = true; video.muted = true; video.loop = true;
          video.poster = s.poster + bust;
          if (s.mp4) { const src = document.createElement('source'); src.src = s.mp4 + bust; src.type = 'video/mp4'; video.appendChild(src); }
          if (s.webm) { const src = document.createElement('source'); src.src = s.webm + bust; src.type = 'video/webm'; video.appendChild(src); }
          video.addEventListener('loadedmetadata', () => { if (isFinite(video.duration)) meta.textContent = `${shot} · ${video.duration.toFixed(1)} s · ${video.videoWidth}×${video.videoHeight}`; });
          video.addEventListener('play', () => { if (current && current !== el && current._stop) current._stop(); current = el; });
          const badge = document.createElement('span'); badge.className = 'badge mono'; badge.textContent = shot;
          media.append(video, badge, qaBadge(s));
          // play() straight after insertion can race source selection in Chromium; retry once it can play
          video.addEventListener('canplay', () => { if (video.paused) video.play().catch(() => {}); }, { once: true });
          video.load();
          video.play().catch(() => {});
        }

        function setShot(t, keepPlaying = true) {
          if (!shots.has(t)) return;
          const wasPlaying = !!video;
          shot = t;
          for (const b of picker.children) b.setAttribute('aria-pressed', String(b.dataset.shot === t));
          const s = shots.get(t);
          open.href = `${ROOM_CREATOR}?house=${encodeURIComponent(h.id)}&shot=${encodeURIComponent(t)}&flythrough=1`;
          dlMp4.hidden = !(s && s.mp4); if (s && s.mp4) dlMp4.href = s.mp4;
          dlWebm.hidden = !(s && s.webm); if (s && s.webm) dlWebm.href = s.webm;
          meta.textContent = '';
          if (wasPlaying && keepPlaying) playVideo(); else { stop(); showPoster(); }
        }

        for (const t of shots.keys()) {
          const b = document.createElement('button'); b.type = 'button'; b.dataset.shot = t; b.textContent = t;
          b.addEventListener('click', () => setShot(t));
          picker.appendChild(b);
        }
        if (!shots.size) {
          picker.hidden = true; dlMp4.hidden = dlWebm.hidden = true;
          open.href = `${ROOM_CREATOR}?house=${encodeURIComponent(h.id)}&shot=${encodeURIComponent(shotTypes[0] || 'door-to-core')}&flythrough=1`;
          showPoster();
        } else {
          setShot(shot, false);
        }

        el._setShot = setShot; el._stop = stop;
        return el;
      }

      function applyFilter() {
        const needle = q.value.trim().toLowerCase();
        for (const c of grid.children) c.hidden = !!needle && !c.dataset.search.includes(needle);
      }
      q.addEventListener('input', applyFilter);

      load();
    })();
  </script>
</body>
</html>
