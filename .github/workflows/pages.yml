# ci-virtual-home — the web portal on GitHub Pages.
# ============================================================================
# Builds the static site (scripts/build-portal.mts: the gallery, the player, the compiled engine, the specs and
# the committed thumbnails — nothing else) and deploys it. The site is served under the repository's sub-path,
# https://companionintelligence.github.io/ci-virtual-home/, which is why every URL in it is relative.
#
# Nothing here renders: the thumbnails are committed (pnpm run portal:thumbs needs a GPU), so this job is an
# install, a type-strip and a copy. Playwright's browsers are not downloaded. Pages must be enabled for the
# repository with "GitHub Actions" as the source before the first run can deploy.
# ============================================================================
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; a newer push waits for the one in flight rather than cancelling it mid-deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build the portal
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm (version from package.json → packageManager)
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build browser assets
        run: pnpm run build

      - name: Assemble the site
        run: pnpm run portal:build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
